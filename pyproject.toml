[project]
name = "zendesk-mcp-server"
version = "0.3.0"
description = "A Zendesk MCP server with Streamable HTTP transport and scoped API-key auth"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=3.4",
    "python-dotenv>=1.0.1",
    "zenpy>=2.0.56",
    "requests>=2.31",
    "cachetools>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = [ "hatchling",]
build-backend = "hatchling.build"

[project.scripts]
zendesk = "zendesk_mcp_server:main"
zendesk-keys = "zendesk_mcp_server.keys_cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
